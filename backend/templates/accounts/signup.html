{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Css -->
    <link rel="stylesheet" href="{% static 'assets/css/main.css' %}" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Poppins -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- Bebas Neue -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />

    <!-- toast -->
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <!-- favicon -->
    <link
      rel="icon"
      type="image/svg+html"
      sizes="16x16"
      href="{% static 'assets/icons/favicons/user-solid-full-v2.svg' %}"
    />
    <title>Sign up</title>
  </head>
  <body style="background-color: rgb(79, 79, 79)">
    <!-- background -->
    <div class="video--bg">
      <video class="video--slower" autoplay muted loop>
        <source
          src="{% static 'assets/video/primary-secondary/Last_one_i_rendred.mp4' %}"
          type="video/mp4"
        />
      </video>
    </div>

    <!-- django errors toast -->
     {% if messages %}
     {% for message in messages %}
     <div class="toast" data-type="{{message.tags}}" data-text="{{message}}">
     </div>
     {% endfor %}
     {% endif %}


    <!-- header -->
    <section class="header">
      <header>
        <h3>Sign-up</h3>
        <i class="fa-solid fa-user"></i>
      </header>
      <i
        id="header__right__icon"
        class="fa-solid fa-circle-arrow-right fa-lg"
      ></i>
    </section>

    <!-- signup -->
    <div style="padding: 4.375rem; display: flex; justify-content: center">
      <main class="signup--form">
        <form method="post" class="login--signup--form__content">
          {% csrf_token %}
          <img
            class="login--signup--form__logo"
            src="{% static 'assets/icons/dont-do-list-logos/dont-do-list-alt.svg' %}"
            alt="dont-do-list-primary"
          />
          <header>
            <p>Create new account.</p>
            <span
              >You have an account?<a
                style="padding-left: 3px"
                href={% url "accounts:login" %}
                >Login here</a
              ></span
            >
          </header>
          <div style="padding: 0" class="text--input--secondary">
            <span class="input_name">Name</span>
            <div class="input_content">
              <span class="input_icon_left"
                ><i class="fa-regular fa-user"></i
              ></span>
              <input
                name="username"
                autocomplete="off"
                max="20"
                id="nameInput"
                type="text"
                class="input_input"
                placeholder="Jason anderson"
              />
            </div>
            <p id="nameDesc" class="input_description"></p>
          </div>
          <div style="padding: 0" class="text--input--secondary">
            <span class="input_name">Email</span>
            <div class="input_content">
              <span style="padding-top: 1px" class="input_icon_left"
                ><i class="fa-solid fa-at"></i
              ></span>
              <input
                name="email"
                autocomplete="off"
                max="20"
                id="emailInput"
                type="text"
                class="input_input"
                placeholder="Example@gmail.com"
              />
            </div>
            <p id="emailDesc" class="input_description"></p>
          </div>

          <div style="padding: 0" class="text--input--secondary">
            <span class="input_name">Password</span>
            <div class="input_content">
              <span class="input_icon_left">
                <img
                  style="width: 13px; padding-top: 3px"
                  src="{% static 'assets/icons/lock/lock-secondary.svg' %}"
                  alt="lock-icon"
                />
              </span>
              <input
                name="password1"
                autocomplete="off"
                max="20"
                id="passwordInput"
                type="password"
                class="input_input"
                placeholder="••••••••"
              />
              <div class="input_content_right">
                <span
                  id="eyeBtn"
                  style="padding-bottom: 1px; cursor: pointer"
                  class="input_icon_right"
                  ><i class="fa-regular fa-eye-slash"></i
                ></span>
              </div>
            </div>
            <p id="passwordDesc" class="input_description"></p>
          </div>

          <div style="padding: 0" class="text--input--secondary">
            <span class="input_name">Confirm password</span>
            <div class="input_content">
              <span class="input_icon_left">
                <img
                  style="width: 13px; padding-top: 3px"
                  src="{% static 'assets/icons/lock/lock-secondary.svg' %}"
                  alt="lock-icon"
                />
              </span>
              <input
                name="password2"
                autocomplete="off"
                max="20"
                id="passwordInput"
                type="password"
                class="input_input"
                placeholder="••••••••"
              />
              <div class="input_content_right">
                <span
                  id="eyeBtn"
                  style="padding-bottom: 1px; cursor: pointer"
                  class="input_icon_right"
                  ><i class="fa-regular fa-eye-slash"></i
                ></span>
              </div>
            </div>
            <p id="passwordDesc" class="input_description"></p>
          </div>
          <div
            style="
              display: flex;
              align-items: center;
              justify-content: space-between;
            "
          >
            <label class="checkbox--secoundry">
              <input
                id="rememberMeSignup"
                class="checkbox__input"
                type="checkbox"
              />
              <span class="checkbox__box"></span>
              <span class="checkbox__label">Remember me</span>
            </label>
            <a href="#">Forgot password?</a>
          </div>
          <button id="submitBtn" class="btn btn--secondary">
            <span>Signup</span>
          </button>
          <div style="margin: 0; flex: 0" class="fancy--divider--secondary">
            <span class="fancy_divider_content">Or continue with</span>
          </div>
          <footer>
            <button id="googleBtn" class="btn btn--secondary">
              <span>Google(soon)</span>
              <span class="btn__icon"
                ><img
                  src="{% static 'assets/icons/google/Google-v2.svg' %}"
                  alt="Google-icon"
              /></span>
            </button>
            <button id="githubBtn" class="btn btn--secondary">
              <span>Github(soon)</span>
              <span class="btn__icon"
                ><img
                  src="{% static 'assets/icons/github/Github-v2.svg' %}"
                  alt="github-icon"
              /></span>
            </button>
          </footer>
        </form>
        <div class="login--signup--form__image">
          <img src="{% static 'assets/images/unsplash-images/signup-img.jpg' %}" alt="signup-img.jpg" />
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="{% static 'assets/js/main.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  </body>
</html>
