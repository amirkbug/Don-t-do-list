<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Css -->
    <link rel="stylesheet" href="/frontend/assets/css/main.css" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Poppins -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- Bebas Neue -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <!-- favicon -->
    <link
      rel="icon"
      type="image/svg+html"
      sizes="16x16"
      href="../assets/icons/other/cloud-arrow-up-solid-full.svg"
    />
    <title>Password reset done</title>
  </head>
  <body style="background-color: rgb(79, 79, 79)">
    <!-- background -->
    <div class="video--bg">
      <video class="video--slower" autoplay muted loop>
        <source
          src="/frontend/assets/video/primary-secondary/Last_one_i_rendred.mp4"
          type="video/mp4"
        />
      </video>
    </div>

    <!-- success card -->
    <div style="display: flex; justify-content: center">
      <main class="password-reset-status-card--neutral">
        <div><i class="fa-solid fa-cloud-arrow-up fa-5x"></i></div>
        <section>
          <h4>Import Guest Tasks?</h4>
          <p>
            We found tasks created in Guest Mode.
            Would you like to save them to your account?
            Unsaved guest tasks will be permanently removed.
          </p>
        </section>
        <footer>
        <a href="home.html">
          <button class="btn btn--natural--100">
            <span>Save Tasks</span>
          </button>
        </a>
        <a href="home.html">
          <button class="btn btn--natural--100">
            <span>Skip</span>
          </button>
        </a>
        </footer>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="../assets/js/main.js"></script>
  </body>
</html>
