<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Css -->
    <link rel="stylesheet" href="/frontend/assets/css/main.css" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Poppins -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- Bebas Neue -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <!-- favicon -->
    <link
      rel="icon"
      type="image/svg+html"
      sizes="16x16"
      href="../assets/icons/favicons/trophy-solid-full-v2.svg"
    />
    <title>Trophy</title>
  </head>
  <body style="background-color: rgb(79, 79, 79)">
    <!-- background -->
    <div class="video--bg">
      <video class="video--slower" autoplay muted loop>
        <source
          src="/frontend/assets/video/primary-secondary/Last one i rendred.mp4"
          type="video/mp4"
        />
      </video>
    </div>

    <!-- header -->
    <div id="headerByCondition">
      <section class="header">
        <header>
          <h3>Trophy details</h3>
          <i class="fa-solid fa-trophy"></i>
        </header>

        <a href="login.html">
          <button
            style="padding: 0 0; margin: 0 0; border: none"
            class="btn btn--video--bg"
          >
            <div class="btn__container">
              <div class="btn__text">
                <span>Login / Signup</span>
                <span class="btn__icon">
                  <i class="fa-solid fa-user"></i>
                </span>
              </div>
            </div>

            <video class="btn__video" muted loop autoplay playsinline>
              <source
                src="../assets/video/primary-secondary/Last one i rendred.mp4"
                type="video/mp4"
              />
              your browser doesent support video
            </video>
          </button>
        </a>
      </section>
    </div>
    <main class="trophy--layout">
      <div class="trophy--card--primary">
        <header class="trophy__header">
          <p>do 10 do tasks</p>
        </header>
        <div class="trophy__image">
          <img
            src="/frontend/assets/images/trophy-pic/Goodies Happy Flame.png"
            alt="Goodies Happy Flame"
          />
        </div>
        <a id="trophyBtn" href="trophy-details.html">
          <button class="btn btn--primary">More info!</button>
        </a>
      </div>

      <div class="trophy--card--secondary">
        <header class="trophy__header">
          <p>Do 10 dont do tasks</p>
        </header>
        <div class="trophy__image">
          <img
            src="/frontend/assets/images/trophy-pic/Goodies-Pointing.png"
            alt="Goodies Happy Flame"
          />
        </div>
        <button class="btn btn--secondary">
          <span>More info!</span>
        </button>
      </div>

      <div class="trophy--card--primary">
        <header class="trophy__header">
          <p>Make 10 do tasks</p>
        </header>
        <div class="trophy__image">
          <img
            src="/frontend/assets/images/trophy-pic/Goodies-Ok.png"
            alt="Goodies Happy Flame"
          />
        </div>
        <button class="btn btn--primary">
          <span>More info!</span>
        </button>
      </div>

      <div class="trophy--card--secondary">
        <header class="trophy__header">
          <p>Make 10 dont do tasks</p>
        </header>
        <div class="trophy__image">
          <img
            src="/frontend/assets/images/trophy-pic/Goodies-Ok.png"
            alt="Goodies Happy Flame"
          />
        </div>
        <button class="btn btn--secondary">
          <span>More info!</span>
        </button>
      </div>

      <div class="trophy--card--primary">
        <header class="trophy__header">
          <p>Do 10 do tasks</p>
        </header>
        <div class="trophy__image">
          <img
            src="/frontend/assets/images/trophy-pic/Goodies-Ok.png"
            alt="Goodies Happy Flame"
          />
        </div>
        <button class="btn btn--primary">
          <span>More info!</span>
        </button>
      </div>

      <div class="trophy--card--primary">
        <header class="trophy__header">
          <p>Make 10 do tasks</p>
        </header>
        <div class="trophy__image">
          <img
            src="/frontend/assets/images/trophy-pic/Goodies Happy Flame.png"
            alt="Goodies Happy Flame"
          />
        </div>
        <button class="btn btn--primary">
          <span>More info!</span>
        </button>
      </div>
    </main>

    <!-- navbar -->
    <div style="display: flex; gap: 10px">
      <nav class="navbar">
        <a href="about-us.html" class="navbar__item" data-label="Info">
          <i class="fa-solid fa-circle-info fa-2xl"></i>
        </a>
        <a href="home.html" class="navbar__item" data-label="Home">
          <i class="fa-solid fa-house fa-2xl"></i>
        </a>
        <a href="trophy.html" class="navbar__item" data-label="Trophy">
          <i class="fa-solid fa-trophy fa-2xl"></i>
        </a>
      </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="../assets/js/main.js"></script>
  </body>
</html>
