<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Css -->
    <link rel="stylesheet" href="/frontend/assets/css/main.css" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Poppins -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- Bebas Neue -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <!-- favicon -->
    <link
      rel="icon"
      type="image/svg+html"
      sizes="16x16"
      href="../assets/icons/lock/lock-solid-full.svg"
    />
    <title>Password reset</title>
  </head>
  <body style="background-color: rgb(79, 79, 79)">
    <!-- background -->
    <div class="video--bg">
      <video class="video--slower" autoplay muted loop>
        <source
          src="/frontend/assets/video/primary-secondary/Last_one_i_rendred.mp4"
          type="video/mp4"
        />
      </video>
    </div>

    <!-- header -->
    <section class="header">
      <header>
        <h3>Password reset</h3>
        <i class="fa-solid fa-lock"></i>
      </header>

      <i
        id="header__right__icon"
        class="fa-solid fa-circle-arrow-right fa-lg"
      ></i>
    </section>

    <!-- password reset -->
    <div style="padding: 4.375rem; display: flex; justify-content: center">
      <main class="password--reset--form">
        <div
          style="padding: 10.375rem 4.375rem"
          class="login--signup--form__content"
        >
          <img
            class="login--signup--form__logo"
            src="../assets/icons/dont-do-list-logos/dont-do-list-outline.svg"
            alt="dont-do-list-primary"
          />
          <header>
            <p>Please enter your email.</p>
            <span
              >Enter your email below and we'll send you a link to create a new
              password.</span
            >
          </header>
          <div style="padding: 0" class="text--input--natural">
            <span class="input_name">Email</span>
            <div class="input_content">
              <span class="input_icon_left"
                ><i class="fa-regular fa-envelope"></i
              ></span>
              <input
                type="text"
                class="input_input"
                placeholder="Example@gmail.com"
              />
            </div>
          </div>

          <button class="btn btn--natural">
            <span>Submit</span>
          </button>
        </div>
        <div class="login--signup--form__image">
          <img
            src="../assets/images/unsplash-images/password-reset-v2.jpg"
            alt="password-reset.jpg"
          />
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="../assets/js/main.js"></script>
  </body>
</html>
